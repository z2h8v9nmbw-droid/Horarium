  .wrap{max-width:460px;margin:0 auto;position:relative;padding:22px 18px;}
  .wrap::before{content:"";position:absolute;inset:6px;border:1px solid rgba(143,111,44,.55);pointer-events:none;}
  .wrap::after{content:"";position:absolute;inset:10px;border:1px solid rgba(143,111,44,.22);pointer-events:none;}

  /* ---------- header ---------- */
  header{text-align:center;margin-bottom:4px;}
  .cross{display:block;margin:2px auto 12px;width:34px;height:42px;}
  .season{color:var(--season);font-size:.82rem;letter-spacing:.16em;font-variant-caps:small-caps;text-transform:lowercase;margin-bottom:8px;}

  .switch{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 4px;}

  .track{width:46px;height:26px;border:1px solid var(--rule);border-radius:14px;background:var(--paper-hi);position:relative;cursor:pointer;flex:0 0 auto;transition:background .25s,border-color .25s;}

  .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--lapis);transition:left .25s,background .25s;}
  .track.working .knob{left:22px;background:var(--gold-bright);}

  /* ---------- day list ---------- */
  .day{margin-top:20px;border-top:1px solid var(--rule);box-shadow:0 1.5px 0 -0.5px var(--rule-soft);}
  .row{display:grid;grid-template-columns:60px 1fr 24px;column-gap:12px;align-items:start;padding:15px 4px 15px 10px;border-bottom:1px solid var(--rule-soft);cursor:pointer;position:relative;transition:background .18s;}
  .row:active{background:rgba(60,44,20,.05);}
  .row.office{border-left:2px solid var(--gold);}
  .row.sacred{border-left:2px solid rgba(143,111,44,.4);}
  .row .time{color:var(--season);font-size:.9rem;padding-top:3px;text-align:right;font-variant-numeric:oldstyle-nums;white-space:nowrap;}
  .row.life .time{color:var(--ink-soft);}
  .row .body .title{font-size:1.12rem;line-height:1.22;}
  .row.office .body .title{font-variant-caps:small-caps;letter-spacing:.035em;font-size:1.18rem;}
  .row.life .body .title{font-size:1.02rem;color:var(--ink-soft);}
  .opip{color:var(--gold-bright);margin-right:.32em;font-size:.82em;vertical-align:.06em;}
  .row .body .detail{color:var(--rubric);font-size:.86rem;margin-top:3px;font-style:italic;}
  .row.sacred .body .detail{color:var(--ink-soft);}
  .box{width:22px;height:22px;border:1.5px solid var(--rule);border-radius:3px;margin-top:3px;position:relative;background:var(--paper-hi);transition:border-color .18s,background .18s;}
  .row.done .box{border-color:var(--gold-bright);background:#ece0c4;}
  .row.done .box::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid var(--gold-bright);border-width:0 2.5px 2.5px 0;transform:rotate(42deg);}
  .row.done .title{color:var(--ink-soft);}
  .row.done .detail{opacity:.65;}
  .now{position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--season);}
  .row.now .time::before{content:"nunc";display:block;color:var(--season);font-size:.6rem;font-variant-caps:small-caps;letter-spacing:.1em;font-style:italic;margin-bottom:1px;}

  /* ---------- footer ---------- */
  footer{margin-top:22px;text-align:center;color:var(--ink-soft);}
  .streak{font-size:1rem;}
  .streak b{color:var(--ink);font-weight:400;font-size:1.15rem;}
  .decades{font-size:.9rem;font-style:italic;margin-top:4px;opacity:.85;}
  .flinks{margin-top:14px;display:flex;gap:18px;justify-content:center;}
  .link{font:inherit;font-size:.85rem;font-style:italic;background:none;border:none;color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--rule);cursor:pointer;padding:4px;}
  .colophon{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule-soft);}
  .wordmark{font-family:'Textura',Georgia,serif;font-size:1.5rem;color:var(--gold);letter-spacing:.02em;}
  .motto{font-style:italic;font-size:.82rem;color:var(--ink-soft);margin-top:2px;}
  .meta{margin-top:14px;font-size:.74rem;opacity:.7;line-height:1.5;}

  /* ---------- edit mode ---------- */
  .edit-bar{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-bottom:12px;border-bottom:1px solid var(--rule);}
  .edit-bar h2{font-family:'Textura',Georgia,serif;font-size:1.8rem;margin:0;font-weight:400;}
  .edit-bar .done{font:inherit;font-size:1rem;background:var(--lapis);color:var(--paper-hi);border:none;border-radius:6px;padding:8px 16px;cursor:pointer;}
  .erow{border-bottom:1px solid var(--rule-soft);padding:12px 2px;}
  .ehead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:10px;}
  .arrows{display:flex;flex-direction:column;gap:2px;}
  .arrows button,.del{font:inherit;background:var(--paper-hi);border:1px solid var(--rule);color:var(--ink-soft);cursor:pointer;border-radius:5px;}
  .arrows button{width:30px;height:20px;line-height:1;font-size:.8rem;}
  .del{width:34px;height:34px;font-size:1.1rem;}
  .esum{cursor:pointer;min-width:0;}
  .esum .et{font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .esum .etime{color:var(--lapis);font-size:.8rem;}
  .badges{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;}
  .badge{font-size:.66rem;font-variant-caps:small-caps;letter-spacing:.06em;padding:1px 7px;border-radius:9px;border:1px solid var(--rule);color:var(--ink-soft);background:var(--paper-hi);}
  .badge.office{color:var(--gold);border-color:var(--gold);}
  .badge.cond{color:var(--rubric);border-color:rgba(138,43,34,.4);}
  .efields{margin-top:12px;padding:12px;background:var(--paper-hi);border:1px solid var(--rule);border-radius:8px;}
  .field{margin-bottom:11px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:.75rem;color:var(--ink-soft);font-variant-caps:small-caps;letter-spacing:.08em;margin-bottom:4px;}
  .field input,.field textarea,.field select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;}
  .field textarea{resize:vertical;min-height:52px;}
  .days{display:flex;gap:5px;}
  .day-chip{flex:1;text-align:center;font:inherit;font-size:.9rem;padding:8px 0;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink-soft);cursor:pointer;}
  .day-chip.on{background:var(--lapis);color:var(--paper-hi);border-color:var(--lapis);}
  .add-btn{width:100%;font:inherit;font-size:1rem;margin-top:16px;padding:12px;background:var(--paper-hi);border:1px dashed var(--gold);color:var(--ink);border-radius:8px;cursor:pointer;}
  details.backup{margin-top:22px;font-size:.9rem;}
  details.backup summary{cursor:pointer;color:var(--ink-soft);font-style:italic;}
  details.backup textarea{width:100%;height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;margin-top:8px;border:1px solid var(--rule);border-radius:6px;padding:8px;background:var(--paper-hi);color:var(--ink);}
  .bbtns{display:flex;gap:10px;margin-top:8px;}
  .bbtns button{flex:1;font:inherit;font-size:.85rem;padding:8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper-hi);color:var(--ink);cursor:pointer;}
  .reset{margin-top:20px;text-align:center;}
  .reset button{font:inherit;font-size:.85rem;font-style:italic;background:none;border:none;color:var(--rubric);text-decoration:underline;text-decoration-color:rgba(138,43,34,.35);cursor:pointer;}
  .hidden{display:none!important;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="cross" viewBox="0 0 44 54" aria-hidden="true">

</div>

<script>
(function(){
  "use strict";
  var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var DAYL=['S','M','T','W','T','F','S'];
  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var ALL=[0,1,2,3,4,5,6];
  var KEY='horarium.v1.';
  var SCHED_KEY='horarium.schedule.v2';

  var DEFAULT=[
    {id:'rise',    sort:330, time:'before six', title:'Rise', detail:'', kind:'life',   when:'both', days:ALL.slice()},
    {id:'lauds',   sort:360, time:'6 am',  title:'Lauds', detail:'The Angelus · Lauds · a decade of the Rosary · the St Michael Prayer', kind:'office', when:'both', days:ALL.slice()},

    {id:'none',    sort:900, time:'3 pm',  title:'None', detail:'Nones · a decade of the Rosary', kind:'office', when:'both', days:ALL.slice()},
    {id:'work-pm2',sort:915, time:'till 5',title:'Work', detail:'', kind:'life', when:'work', days:ALL.slice()},
    {id:'run-pm',  sort:1020,time:'5 pm',  title:'Run', detail:'', kind:'life', when:'home', days:ALL.slice()},
    {id:'vespers', sort:1080,time:'6 pm',  title:'Vespers', detail:'The Angelus · Vespers · a decade of the Rosary', kind:'office', when:'both', days:ALL.slice()},
    {id:'tea',     sort:1125,time:'',      title:'Tea', detail:'', kind:'life', when:'both', days:ALL.slice()},
    {id:'ev-mon',  sort:1170,time:'evening',title:'Gym', detail:'', kind:'life', when:'work', days:[1]},

    {id:'ev-wed',  sort:1172,time:'evening',title:'Football, or the Brothers', detail:'', kind:'life', when:'both', days:[3]},
    {id:'ev-thu',  sort:1173,time:'evening',title:"Men's Oratory", detail:'', kind:'sacred', when:'both', days:[4]},
    {id:'ev-fri',  sort:1174,time:'evening',title:'Padel', detail:'', kind:'life', when:'both', days:[5]},
    {id:'ev-sat',  sort:1175,time:'evening',title:'Holy Hour', detail:'', kind:'sacred', when:'both', days:[6]},
    {id:'ev-sun',  sort:1176,time:'evening',title:'Quiz', detail:'', kind:'life', when:'both', days:[0]},
    {id:'compline',sort:1260,time:'9 pm',  title:'Compline', detail:'Bible in a Year · Compline', kind:'office', when:'both', days:ALL.slice()},
    {id:'rest',    sort:1305,time:'',      title:'Read, then bed', detail:'', kind:'life', when:'both', days:ALL.slice()}
  ];
  function clone(x){return JSON.parse(JSON.stringify(x));}

  function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
  function addDays(dt,n){var x=new Date(dt);x.setDate(x.getDate()+n);return x;}
  function season(dt){
    var y=dt.getFullYear(),t=dt.getTime(),eas=easter(y),ash=addDays(eas,-46),pent=addDays(eas,49);
    var xmas=new Date(y,11,25),sun=addDays(xmas,-(xmas.getDay()===0?7:xmas.getDay())),adv=addDays(sun,-21);
    var xmasEnd=new Date(y,0,13);
    if(t>=adv.getTime()&&t<xmas.getTime())return{name:'Advent',color:'#5a3e76'};
    if(t>=xmas.getTime()||t<xmasEnd.getTime())return{name:'Christmastide',color:'#a07a24'};
    if(t>=ash.getTime()&&t<eas.getTime())return{name:'Lent',color:'#5a3e76'};
    if(t>=eas.getTime()&&t<pent.getTime())return{name:'Eastertide',color:'#a07a24'};
    return{name:'Ordinary Time',color:'#3e6b4a'};
  }
  function dayDiff(a,b){return Math.round((a.getTime()-b.getTime())/86400000);}
  function advent(y){var xmas=new Date(y,11,25);var sun=addDays(xmas,-(xmas.getDay()===0?7:xmas.getDay()));return addDays(sun,-21);}
  function liturgy(dt){
    var RED='#9a2e26',ROSE='#a85a68',GOLD='#a07a24';
    var y=dt.getFullYear(),E=easter(y),dE=dayDiff(dt,E);
    var sp={'-21':['Laetare',ROSE],'-7':['Palm Sunday',RED],'-3':['Maundy Thursday',GOLD],
            '-2':['Good Friday',RED],'49':['Pentecost',RED],'56':['Trinity Sunday',GOLD],
            '60':['Corpus Christi',GOLD],'68':['The Sacred Heart',GOLD]};
    if(sp[dE])return{name:sp[dE][0],color:sp[dE][1]};
    var dA=dayDiff(dt,advent(y));
    if(dA===-7)return{name:'Christ the King',color:GOLD};
    if(dA===14)return{name:'Gaudete',color:ROSE};
    return season(dt);
  }

  function dkey(dt){return KEY+dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2);}
  function loadDay(dt){try{var r=localStorage.getItem(dkey(dt));return r?JSON.parse(r):{working:false,done:{}};}catch(e){return{working:false,done:{}};}}
  function saveDay(dt,s){try{localStorage.setItem(dkey(dt),JSON.stringify(s));}catch(e){}}
  function loadSchedule(){try{var r=localStorage.getItem(SCHED_KEY);if(r){var a=JSON.parse(r);if(a&&a.length)return a;}}catch(e){}var s=clone(DEFAULT);schedule=s;saveSchedule();return s;}
  function saveSchedule(){try{localStorage.setItem(SCHED_KEY,JSON.stringify(schedule));}catch(e){}}
  function runMigrations(){
    var mkey='horarium.migrations',done={};
    try{done=JSON.parse(localStorage.getItem(mkey)||'{}')||{};}catch(e){done={};}
    var changed=false;
    if(!done['compline-5']){
      schedule.forEach(function(it){
        if(it.id==='compline'&&/decade of the Rosary/i.test(it.detail)){
          it.detail=it.detail.replace(/\s*·\s*a decade of the Rosary/i,'');changed=true;
        }
      });
      done['compline-5']=1;
    }
    if(changed)saveSchedule();
    try{localStorage.setItem(mkey,JSON.stringify(done));}catch(e){}
  }

  var today=new Date();
  var state=loadDay(today); if(!state.done)state.done={};
  var schedule=[]; schedule=loadSchedule();
  runMigrations();
  var editing=false, expandedId=null;

  var elDay=document.getElementById('day');
  function nowMins(){var n=new Date();return n.getHours()*60+n.getMinutes();}
  function isToday(){return (new Date()).toDateString()===today.toDateString();}
  function visibleToday(){
    var dow=today.getDay(), working=!!state.working;
    return schedule.filter(function(it){
      if(it.days.indexOf(dow)<0)return false;
      if(it.when==='work'&&!working)return false;
      if(it.when==='home'&&working)return false;
      return true;
    });
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function renderDay(){
    var items=visibleToday(), cur=null;
    if(isToday()){var nm=nowMins();items.forEach(function(it){if(it.sort<=nm)cur=it.id;});}
    elDay.innerHTML='';
    items.forEach(function(it){
      var row=document.createElement('div');
      row.className='row '+it.kind+(state.done[it.id]?' done':'')+(it.id===cur?' now':'');
      row.setAttribute('role','checkbox');
      row.setAttribute('aria-checked',state.done[it.id]?'true':'false');
      row.setAttribute('tabindex','0');
      var titleHtml=(it.kind==='office'?'<span class="opip">✠</span>':'')+esc(it.title);
      row.innerHTML=(it.id===cur?'<span class="now"></span>':'')+
        '<div class="time">'+esc(it.time)+'</div>'+
        '<div class="body"><div class="title">'+titleHtml+'</div>'+(it.detail?'<div class="detail">'+esc(it.detail)+'</div>':'')+'</div>'+
        '<div class="box"></div>';
      function toggle(){if(state.done[it.id])delete state.done[it.id];else state.done[it.id]=true;saveDay(today,state);renderDay();updateFooter();}
      row.addEventListener('click',toggle);
      row.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});
      elDay.appendChild(row);
    });
  }

  var KINDS=[['office','Office (prayer)'],['sacred','Sacred'],['life','Everyday']];
  var WHENS=[['both','Always'],['home','At-home days'],['work','Working days']];
  function whenLabel(w){return w==='home'?'at-home days':w==='work'?'working days':'';}

  function renderEdit(){
    elDay.innerHTML='';
    var bar=document.createElement('div'); bar.className='edit-bar';
    bar.innerHTML='<h2>Your rule</h2><button class="done" id="doneEdit">Done</button>';
    elDay.appendChild(bar);
    bar.querySelector('#doneEdit').addEventListener('click',exitEdit);

    schedule.forEach(function(it,idx){
      var er=document.createElement('div'); er.className='erow';
      var open=(it.id===expandedId);
      var head=document.createElement('div'); head.className='ehead';
      var badges='<span class="badge '+it.kind+'">'+it.kind+'</span>';
      if(it.when!=='both')badges+='<span class="badge cond">'+whenLabel(it.when)+'</span>';
      if(it.days.length<7)badges+='<span class="badge cond">'+it.days.slice().sort().map(function(d){return DOW[d].slice(0,3);}).join(' ')+'</span>';
      head.innerHTML=
        '<div class="arrows"><button aria-label="Move up">▲</button><button aria-label="Move down">▼</button></div>'+
        '<div class="esum"><div class="et">'+esc(it.title||'(untitled)')+'</div><div class="etime">'+(esc(it.time)||'—')+'</div><div class="badges">'+badges+'</div></div>'+
        '<button class="del" aria-label="Delete">×</button>';
      er.appendChild(head);
      var ups=head.querySelectorAll('.arrows button');
      ups[0].addEventListener('click',function(){move(idx,-1);});
      ups[1].addEventListener('click',function(){move(idx,1);});
      head.querySelector('.esum').addEventListener('click',function(){expandedId=open?null:it.id;renderEdit();});
      head.querySelector('.del').addEventListener('click',function(){
        if(confirm('Remove \u201c'+(it.title||'this item')+'\u201d from the day?')){schedule.splice(idx,1);saveSchedule();if(expandedId===it.id)expandedId=null;renderEdit();}
      });
      if(open){
        var f=document.createElement('div'); f.className='efields';
        f.appendChild(fieldInput('Time',it.time,function(v){it.time=v;saveSchedule();}));
        f.appendChild(fieldInput('Title',it.title,function(v){it.title=v;saveSchedule();}));
        f.appendChild(fieldArea('Prayers / notes',it.detail,function(v){it.detail=v;saveSchedule();}));
        f.appendChild(fieldSelect('Kind',KINDS,it.kind,function(v){it.kind=v;saveSchedule();renderEdit();}));
        f.appendChild(fieldSelect('Shows on',WHENS,it.when,function(v){it.when=v;saveSchedule();renderEdit();}));
        f.appendChild(fieldDays(it));
        var doneF=document.createElement('button'); doneF.className='day-chip'; doneF.style.marginTop='4px'; doneF.style.flex='none'; doneF.style.padding='8px 18px'; doneF.textContent='Close';
        doneF.addEventListener('click',function(){expandedId=null;renderEdit();});
        f.appendChild(doneF);
        er.appendChild(f);
      }
      elDay.appendChild(er);
    });

    var add=document.createElement('button'); add.className='add-btn'; add.textContent='+  Add to the day';
    add.addEventListener('click',function(){
      var last=schedule.length?schedule[schedule.length-1].sort:600;
      var it={id:'item-'+Date.now(),sort:last+15,time:'',title:'New item',detail:'',kind:'life',when:'both',days:ALL.slice()};
      schedule.push(it); saveSchedule(); expandedId=it.id; renderEdit();
    });
    elDay.appendChild(add);

    var bk=document.createElement('details'); bk.className='backup';
    bk.innerHTML='<summary>Backup &amp; restore</summary>';
    var ta=document.createElement('textarea'); ta.value=JSON.stringify(schedule); ta.readOnly=true; bk.appendChild(ta);
    var bb=document.createElement('div'); bb.className='bbtns';
    var copy=document.createElement('button'); copy.textContent='Copy backup';
    copy.addEventListener('click',function(){ta.readOnly=false;ta.select();try{navigator.clipboard.writeText(ta.value);}catch(e){document.execCommand('copy');}ta.readOnly=true;copy.textContent='Copied \u2713';setTimeout(function(){copy.textContent='Copy backup';},1500);});
    var imp=document.createElement('button'); imp.textContent='Paste & restore';
    imp.addEventListener('click',function(){
      if(!bk.querySelector('.importbox')){var box=document.createElement('textarea');box.className='importbox';box.style.width='100%';box.style.height='90px';box.placeholder='Paste a backup here, then tap Paste & restore again';bk.appendChild(box);box.focus();return;}
      var t=bk.querySelector('.importbox').value.trim(); if(!t)return;
      try{var a=JSON.parse(t);if(a&&a.length){schedule=a;saveSchedule();expandedId=null;renderEdit();}else alert('That doesn\u2019t look like a saved rule.');}
      catch(e){alert('Could not read that backup.');}
    });
    bb.appendChild(copy); bb.appendChild(imp); bk.appendChild(bb);
    elDay.appendChild(bk);

    var rs=document.createElement('div'); rs.className='reset';
    var rb=document.createElement('button'); rb.textContent='Reset to the original rule';
    rb.addEventListener('click',function(){if(confirm('Replace everything with the original rule? Your edits will be lost.')){schedule=clone(DEFAULT);saveSchedule();expandedId=null;renderEdit();}});
    rs.appendChild(rb); elDay.appendChild(rs);
  }

  function fieldInput(label,val,on){var w=document.createElement('div');w.className='field';w.innerHTML='<label>'+label+'</label>';var i=document.createElement('input');i.type='text';i.value=val||'';i.addEventListener('input',function(){on(i.value);});w.appendChild(i);return w;}
  function fieldArea(label,val,on){var w=document.createElement('div');w.className='field';w.innerHTML='<label>'+label+'</label>';var t=document.createElement('textarea');t.value=val||'';t.addEventListener('input',function(){on(t.value);});w.appendChild(t);return w;}
  function fieldSelect(label,opts,val,on){var w=document.createElement('div');w.className='field';w.innerHTML='<label>'+label+'</label>';var s=document.createElement('select');opts.forEach(function(o){var op=document.createElement('option');op.value=o[0];op.textContent=o[1];if(o[0]===val)op.selected=true;s.appendChild(op);});s.addEventListener('change',function(){on(s.value);});w.appendChild(s);return w;}
  function fieldDays(it){var w=document.createElement('div');w.className='field';w.innerHTML='<label>Days</label>';var d=document.createElement('div');d.className='days';DAYL.forEach(function(ltr,idx){var c=document.createElement('button');c.className='day-chip'+(it.days.indexOf(idx)>=0?' on':'');c.textContent=ltr;c.title=DOW[idx];c.addEventListener('click',function(){var p=it.days.indexOf(idx);if(p>=0){if(it.days.length>1)it.days.splice(p,1);}else it.days.push(idx);saveSchedule();c.className='day-chip'+(it.days.indexOf(idx)>=0?' on':'');});d.appendChild(c);});w.appendChild(d);return w;}

  function move(i,dir){
    var j=i+dir; if(j<0||j>=schedule.length)return;
    var m=schedule.splice(i,1)[0]; schedule.splice(j,0,m);
    var prev=schedule[j-1], next=schedule[j+1];
    var lo=prev?prev.sort:(next?next.sort-30:0), hi=next?next.sort:(prev?prev.sort+30:1440);
    m.sort=Math.round((lo+hi)/2);
    saveSchedule(); renderEdit();
  }

  function officeItemsFor(dt){return schedule.filter(function(it){return it.kind==='office'&&it.days.indexOf(dt.getDay())>=0;});}
  function officesComplete(dt){var s=loadDay(dt),offs=officeItemsFor(dt);if(!s.done||!offs.length)return false;return offs.every(function(it){return s.done[it.id];});}
  function updateFooter(){
    var d=new Date(today),streak=0;
    if(!officesComplete(d))d=addDays(d,-1);
    while(officesComplete(d)){streak++;d=addDays(d,-1);}
    var s=document.getElementById('streak');
    if(streak>0)s.innerHTML='The hours kept — <b>'+streak+'</b> day'+(streak===1?'':'s')+' running';
    else s.textContent='A new beginning today.';
    var vis=visibleToday().filter(function(it){return /decade/i.test(it.detail);});
    var done=vis.filter(function(it){return state.done[it.id];}).length;
    document.getElementById('decades').textContent=vis.length?('Decades of the Rosary today — '+done+' of '+vis.length):'';
  }

  function setSeason(){var se=liturgy(today);document.documentElement.style.setProperty('--season',se.color);document.getElementById('season').textContent=se.name;}
  function setWeekday(){var n=DOW[today.getDay()];document.getElementById('weekday').innerHTML='<span class="vinit">'+n.charAt(0)+'</span>'+esc(n.slice(1));document.getElementById('date').textContent=today.getDate()+' '+MON[today.getMonth()]+' '+today.getFullYear();}
  var track=document.getElementById('track'),lblHome=document.getElementById('lbl-home'),lblWork=document.getElementById('lbl-work');
  function paintSwitch(){track.classList.toggle('working',!!state.working);track.setAttribute('aria-checked',state.working?'true':'false');lblHome.classList.toggle('on',!state.working);lblWork.classList.toggle('on',!!state.working);}
  function toggleWork(){state.working=!state.working;saveDay(today,state);paintSwitch();renderDay();updateFooter();}
  track.addEventListener('click',toggleWork);
  track.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleWork();}});
  lblHome.addEventListener('click',function(){if(state.working)toggleWork();});
  lblWork.addEventListener('click',function(){if(!state.working)toggleWork();});
  document.getElementById('clear').addEventListener('click',function(){state.done={};saveDay(today,state);renderDay();updateFooter();});
  document.getElementById('edit').addEventListener('click',enterEdit);

  function enterEdit(){editing=true;expandedId=null;document.getElementById('switchWrap').classList.add('hidden');document.getElementById('footer').classList.add('hidden');renderEdit();window.scrollTo(0,0);}
  function exitEdit(){editing=false;document.getElementById('switchWrap').classList.remove('hidden');document.getElementById('footer').classList.remove('hidden');renderDay();updateFooter();window.scrollTo(0,0);}

  setWeekday();setSeason();paintSwitch();renderDay();updateFooter();

  setInterval(function(){if(!editing&&isToday())renderDay();},60000);
  setInterval(function(){
    if(editing)return;
    var n=new Date();
    if(n.toDateString()!==today.toDateString()){
      today=new Date();state=loadDay(today);if(!state.done)state.done={};
      setWeekday();setSeason();paintSwitch();renderDay();updateFooter();
    }
  },60000);
})();
</script>
</body>
</html>
